# agent-gate:format:1
name: Format

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up the project as agent-gates install --setup named
        run: sh .githooks/ci-setup
      - name: Run the format command the hook installs, and refuse what it changes
        run: sh .githooks/pre-commit.d/format --check
